<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ご予約 - りしん東洋医学治療院</title>
<style>
  :root{--green:#1a3d2e;--green2:#2a5a44;--bg:#f4f6f4;--gray:#6b766f;--ink:#1f2a24}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:0 0 40px}
  .hero{background:var(--green);color:#fff;padding:22px 20px 18px;text-align:center}
  .hero h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.02em}
  .sec{padding:22px 18px 0}
  .sec p{margin:0 0 12px}
  .btn{display:block;width:100%;min-height:52px;line-height:52px;border-radius:10px;background:var(--green2);color:#fff;font-size:16px;font-weight:600;text-align:center;text-decoration:none;margin:20px 0 12px}
  .sub{font-size:13px;color:var(--gray)}
  .sub a{color:var(--green2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>りしん東洋医学治療院</h1></div>
  <div class="sec">
    <p><b>ご予約のページは、新しいページに移りました。</b></p>
    <p>ご予約・ご予約の確認や変更は、下のボタンから新しいページでお願いいたします。</p>
    <a class="btn" id="go" href="https://rishin-cloud-production.rishin-cloud.workers.dev/p/reshin/">新しい予約ページを開く</a>
    <p class="sub">すでにいただいているご予約は、そのまま新しいページに引き継いでいます。</p>
    <p class="sub">うまく開けない時は、お電話（<a href="tel:0899068249">089-906-8249</a>）でご連絡ください。</p>
  </div>
</div>
<script>
try{
  var line=/Line\//i.test(navigator.userAgent);
  if(/[?&]intake=open(&|$)/.test(location.search)){
    var to=line?"https://liff.line.me/2012550882-3lQKKygN/monshin":"https://rishin-cloud-production.rishin-cloud.workers.dev/p/reshin/monshin";
    document.getElementById("go").href=to;
    document.getElementById("go").textContent="問診票のページを開く";
    location.replace(to);
  }else{
    var vs=/[?&]view=slots(&|$)/.test(location.search)?"?view=slots":"";
    document.getElementById("go").href=line?"https://liff.line.me/2012550882-3lQKKygN"+vs:"https://rishin-cloud-production.rishin-cloud.workers.dev/p/reshin/"+vs;
  }
}catch(e){}
</script>
</body>
</html>
